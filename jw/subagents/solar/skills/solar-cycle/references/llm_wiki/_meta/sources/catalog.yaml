source_selection_rules:
  - Prefer the smallest set of sources that covers an entry's material fields.
  - Use a second independent source for mechanism boundaries and terminology checks.
  - Verify formulas, units, tables, and numerical thresholds against page images or original PDFs.
  - Record edition and publication year before accepting time-sensitive claims.
  - Do not package raw source text into the built-in Wiki without confirmed redistribution rights.

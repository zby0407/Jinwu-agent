agent_consumers:
  unified_research_agent:
    contract: coordinate scope, conflicts, and candidate writeback
  research_planner:
    contract: use mechanisms, forecast definitions, standard paradigms, and known gaps
  data_and_features:
    contract: use source limitations, issue-time availability, label semantics, and feature-to-physics boundaries
  automatic_experiment:
    contract: use standard paradigms, leakage controls, baselines, and historical memory
  scientific_hypothesis:
    contract: ground mechanisms and bind falsification conditions
  evidence_review:
    contract: apply canonical boundaries, baseline-relative skill, calibration, counterexamples, and wording controls
  knowledge_manager:
    contract: maintain ingest, lifecycle, conflict, and provenance

catalogs:
  entries: _meta/entry_catalog.yaml
  sources: _meta/sources/catalog.yaml

templates:
  entry: templates/entry_template.md
  source: _meta/templates/source_record_template.yaml
  review: templates/canonical_review_checklist.md

schema_version: llm-wiki-manifest-v1
wiki_id: solar_cycle_co_scientist
version: 0.3.0
status: active
language: zh-CN
design_basis: docs/architecture/2026-06-20-solar-cycle-co-scientist-design.md
purpose:
  primary_stage: multi_stage_research
  consumer: solar-specialists
  loading_strategy: deterministic_task_bundle
  statement_zh: 为太阳活动周、极区前兆、代理漂移与耀斑预测提供可追溯的机制、数据和实验约束
  boundary_zh: Wiki 只约束机制、适用范围与检验方法，不替代项目观测或实验事实

scope:
  primary:
    - cycle26_prediction
    - polar_precursor_review
    - indicator_drift_analysis
    - dynamo_mechanism_review
    - knowledge_provenance_conflict
    - flare_forecast
  secondary:
    - active_region_and_flare_context
  out_of_scope:
    - general_astronomy_encyclopedia
    - unbounded_operational_space_weather_forecasting
    - raw_book_chunk_storage
    - model_generated_numerical_results

always_load:

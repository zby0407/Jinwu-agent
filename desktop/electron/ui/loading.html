<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;"
  />
  <title>金乌正在启动</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    main {
      text-align: center;
      padding: 32px;
      width: min(520px, 100%);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      font-size: 14px;
      color: #8b949e;
      line-height: 1.7;
    }
    .logo {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 24px 70px rgba(232, 184, 74, 0.2);
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 22px;
      border-radius: 50%;
      border: 3px solid #21262d;
      border-top-color: #e8b84a;
      animation: spin 900ms linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .note {
      margin-top: 26px;
      font-size: 12.5px;
      color: #6e7681;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./assets/logo.png" alt="金乌" />
    <div class="spinner" aria-hidden="true"></div>
    <h1>金乌正在启动</h1>
    <p>正在准备本地配置与服务。界面就绪后将先开放草稿编辑，智能体准备完成后可发送。</p>
    <p id="elapsed" role="status">已用时 0 秒</p>
    <p><a href="jinwu-action:configure">API 与连接设置</a></p>
    <p class="note">本窗口不会访问外网，仅监听 127.0.0.1。</p>
  </main>
  <script src="./loading.js"></script>
</body>
</html>

services:
  jw:
    image: jw-agent:local
    build:
      context: .
    container_name: jw
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      # Working directory for the agent
      - ./workspace:/workspace
      # Persistent app data: sessions, global skills, memories, config
      - jw-data:/home/jw/.jw

volumes:
  jw-data:
